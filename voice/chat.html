<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ridge — chat</title>
<style>
  body { background:#0d1210; color:#dfe7e2; font:14px/1.55 ui-monospace,Menlo,monospace;
         margin:0; display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 18px; border-bottom:1px solid #223129; }
  header b { color:#2ee08a; } header span { color:#7d8f86; font-size:12px; }
  #sims { display:flex; align-items:center; gap:8px; padding:9px 18px;
          border-bottom:1px solid #223129; flex-wrap:wrap; }
  .simlabel { font-size:12px; color:#7d8f86; text-transform:uppercase;
              letter-spacing:.09em; }
  .sim { background:#141b17; color:#dfe7e2; border:1px solid #2ee08a;
         border-radius:6px; font:13px ui-monospace,Menlo,monospace;
         padding:6px 12px; cursor:pointer; }
  .sim:hover { background:#1c2a22; }
  .sim:disabled { opacity:.45; cursor:default; }
  #simst { font-size:12px; color:#7d8f86; }
  #log { flex:1; overflow-y:auto; padding:14px 18px; display:flex;
         flex-direction:column; gap:10px; }
  .msg { max-width:72ch; white-space:pre-wrap; padding:8px 12px; border-radius:6px; }
  .me { align-self:flex-end; background:#1c2a22; }
  .ridge { align-self:flex-start; background:#141b17; border:1px solid #223129; }
  .tool { align-self:flex-start; color:#7aa7e0; font-size:12px; padding:0 4px; }
  .err { color:#e0665a; }
  form { display:flex; gap:8px; padding:12px 18px; border-top:1px solid #223129; }
  input { flex:1; background:#141b17; border:1px solid #223129; border-radius:6px;
          color:#dfe7e2; font:14px ui-monospace,Menlo,monospace; padding:10px 12px; }
  input:focus { outline:1px solid #2ee08a; }
  button { background:#2ee08a; color:#06130c; border:0; border-radius:6px;
           font:700 14px ui-monospace,Menlo,monospace; padding:0 20px; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header><b>🤖 Ridge</b> — text mode &nbsp;<span>controls REACH through the MCP server ·
watch the feed (:3000) and the mind (:8020)</span><br>
<span id="who">acting for: …</span>
&nbsp;·&nbsp;<input id="imsg" placeholder="+1555… link iMessage" style="width:150px;
background:#141b17;border:1px solid #223129;border-radius:4px;color:#dfe7e2;
font:12px ui-monospace,Menlo,monospace;padding:3px 6px">
<button id="linkbtn" style="font-size:12px;padding:3px 10px">Link</button>
<span id="linkst" style="font-size:12px;color:#7d8f86"></span></header>
<div id="sims">
  <span class="simlabel">simulate:</span>
  <button class="sim" id="sim-win">✅ successful week</button>
  <button class="sim" id="sim-miss">⚠️ missing challenges</button>
  <span id="simst"></span>
</div>
<div id="log"></div>
<form id="f">
  <input id="inp" autocomplete="off" autofocus
         placeholder='try: "make carla a 7-day weekend-guard recovery challenge"'>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log");
let rendered = 0, busy = false, me = null;

// Follow whoever is logged into the REACH app: localhost cookies ignore ports,
// so the app's session cookie rides along to :8010 — we just ask "who am I?".
(async () => {
  const who = document.getElementById("who");
  try {
    const r = await fetch("http://localhost:8010/api/users/me/",
                          { credentials: "include" });
    if (r.ok) {
      me = await r.json();
      who.textContent = `acting for: ${me.name || me.username} (from the app's login)`;
      return;
    }
  } catch (e) { /* backend down or CORS — fall through */ }
  who.textContent = "acting for: carla_codes (default — log into the app at :3000 to switch)";
})();

const add = (cls, txt) => {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = txt;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
};

const evLine = (ev) => {
  const res = typeof ev.result === "object" && ev.result
    ? (ev.result.id ? `→ id ${ev.result.id}` : `→ ${JSON.stringify(ev.result).slice(0, 120)}`)
    : `→ ${ev.result}`;
  return `⚙ ${ev.tool}(${JSON.stringify(ev.args).slice(0, 110)}) ${res}`;
};

// The Mongo transcript is the single source of truth — text AND voice turns.
// Reopening this page replays the whole conversation. No cold start.
async function render(force) {
  if (busy) return;
  try {
    const url = me?.username ? `/history?username=${encodeURIComponent(me.username)}` : "/history";
    const h = await (await fetch(url)).json();
    if (!force && h.length === rendered) return;
    log.innerHTML = "";
    h.forEach(m => {
      (m.events || []).forEach(ev => add("tool", evLine(ev)));
      const tag = m.source === "voice" ? "🎙 " : "";
      add(m.role === "user" ? "me" : "ridge", tag + m.content);
    });
    rendered = h.length;
  } catch (e) { /* bridge briefly down — next poll catches up */ }
}

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const inp = document.getElementById("inp"), btn = document.getElementById("send");
  const text = inp.value.trim();
  if (!text) return;
  add("me", text); inp.value = ""; btn.disabled = true; busy = true;
  const thinking = add("ridge", "…");
  try {
    await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, username: me?.username }),
    });
  } catch (err) { add("ridge err", "error: " + err); }
  busy = false; thinking.remove();
  await render(true);
  btn.disabled = false; inp.focus();
};

// Demo simulations — run the care sweep for whoever this chat is acting for.
// Same tool the agent calls itself; the result lands in this thread AND the
// user's in-app bell.
async function simulate(tone, btn) {
  const st = document.getElementById("simst");
  const who = me?.username || "carla_codes";
  const name = me?.name || who;
  document.querySelectorAll(".sim").forEach(b => b.disabled = true);
  st.textContent = `Ridge is reaching out to ${name}…`;
  add("tool", `⚙ care_sweep({"username":"${who}","tone":"${tone}"})`);
  try {
    const r = await (await fetch("/simulate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: who, tone }),
    })).json();
    st.textContent = r.delivered
      ? `✓ sent to ${name} — check the bell + this thread`
      : `failed: ${(r.detail || "").toString().slice(0, 120)}`;
  } catch (e) { st.textContent = "error: " + e; }
  document.querySelectorAll(".sim").forEach(b => b.disabled = false);
  await render(true);
}
document.getElementById("sim-win").onclick = (e) => simulate("celebrate", e.target);
document.getElementById("sim-miss").onclick = (e) => simulate("encourage", e.target);

// "Log in" for iMessage: bind your handle to the account you're signed into.
document.getElementById("linkbtn").onclick = async () => {
  const handle = document.getElementById("imsg").value.trim();
  const st = document.getElementById("linkst");
  if (!handle) { st.textContent = "enter your phone/email"; return; }
  if (!me?.username) { st.textContent = "log into the app at :3000 first"; return; }
  const r = await (await fetch("/link", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ handle, username: me.username }),
  })).json();
  st.textContent = r.linked ? `✓ ${r.linked} → ${r.username}` : (r.error || "failed");
};

render(true);
setInterval(() => render(false), 3000);
</script>
</body>
</html>
