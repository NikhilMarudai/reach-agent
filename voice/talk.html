<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Talk to Ridge</title>
<style>
  body { background:#0d1210; color:#dfe7e2; font:15px/1.6 ui-monospace,Menlo,monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         min-height:100vh; margin:0; gap:18px; }
  h1 { font-size:19px; margin:0; } .sub { color:#7d8f86; font-size:12.5px; }
  button { background:#2ee08a; color:#06130c; border:0; border-radius:6px;
           font:700 15px ui-monospace,Menlo,monospace; padding:12px 26px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { width:min(640px,90vw); max-height:40vh; overflow-y:auto; font-size:12.5px;
         color:#9fb0a7; border-top:1px solid #223129; padding-top:10px; }
  .me { color:#e0b05a; } .ridge { color:#2ee08a; } .tool { color:#7aa7e0; }
</style>
</head>
<body>
<h1>🎙 Ridge — live</h1>
<div class="sub">speak; when you ask it to act, watch the REACH feed + the mind viewer</div>
<button id="btn">Start conversation</button>
<div id="log"></div>
<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";

const log = (cls, txt) => {
  const d = document.createElement("div");
  d.className = cls; d.textContent = txt;
  document.getElementById("log").prepend(d);
};

document.getElementById("btn").onclick = async () => {
  const btn = document.getElementById("btn");
  btn.disabled = true; btn.textContent = "connecting…";
  try {
    const { signed_url } = await (await fetch("/signed-url")).json();
    await Conversation.startSession({
      signedUrl: signed_url,
      clientTools: {
        trigger_deliberation: async ({ username }) => {
          log("tool", `⚙ trigger_deliberation(${username})`);
          const r = await (await fetch("/act", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username }),
          })).json();
          return `Deliberation started for ${r.username}. It takes about a `
               + `minute — tell them to watch their feed for my comment and `
               + `any plan changes.`;
        },
      },
      onMessage: (m) => {
        if (m?.message) log(m.source === "user" ? "me" : "ridge",
                            `${m.source === "user" ? "you" : "ridge"}: ${m.message}`);
      },
      onStatusChange: (s) => { btn.textContent = `status: ${s.status ?? s}`; },
      onError: (e) => log("tool", `error: ${e}`),
    });
  } catch (e) {
    btn.disabled = false; btn.textContent = "Start conversation";
    log("tool", `failed to connect: ${e}`);
  }
};
</script>
</body>
</html>
